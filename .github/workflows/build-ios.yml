name: Build Unsigned IPA

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-seafood-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen & ldid
        run: |
          brew install xcodegen ldid

      - name: Bump build number
        run: |
          BUILD_NO=$((1000 + ${GITHUB_RUN_NUMBER:-0}))
          echo "BUILD_NO=$BUILD_NO" >> "$GITHUB_ENV"
          VERSION=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*MARKETING_VERSION: *"?([0-9.]+)"?/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          perl -pi -e "s/CURRENT_PROJECT_VERSION: \"\d+\"/CURRENT_PROJECT_VERSION: \"$BUILD_NO\"/" project.yml

      - name: Generate project
        run: |
          xcodegen generate
          echo "--- targets ---"
          xcodebuild -list -project SeafoodInventory.xcodeproj

      - name: Build (unsigned)
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project SeafoodInventory.xcodeproj \
            -scheme SeafoodInventory \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build > build.log 2>&1; then
            echo "===== BUILD FAILED ====="
            grep -nE "error:|BUILD FAILED|The following build commands failed" build.log | head -200 || true
            tail -80 build.log
            exit 1
          fi
          tail -5 build.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Seafood.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "找不到编译产物"; find build/Build/Products -maxdepth 3; exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ldid -Sentitlements.plist "Payload/Seafood.app/Seafood" || ldid -S "Payload/Seafood.app/Seafood"
          IPA="Seafood-${VERSION}-b${BUILD_NO}.ipa"
          zip -qry "$IPA" Payload
          SIZE=$(stat -f %z "$IPA")
          SHA=$(shasum -a 256 "$IPA" | awk '{print $1}')
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "IPA_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "IPA_SHA=$SHA" >> "$GITHUB_ENV"
          cat > manifest.json <<EOF
          {
            "version": "${VERSION}",
            "build": ${BUILD_NO},
            "notes": "自动构建，基于 ${GITHUB_SHA::7}",
            "ipa_url": "https://backups.lyvw.top:4433/api/app/download/${IPA}",
            "min_ios": "16.4",
            "size": ${SIZE},
            "sha256": "${SHA}"
          }
          EOF
          cat manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seafood-${{ env.VERSION }}-b${{ env.BUILD_NO }}
          path: |
            ${{ env.IPA }}
            manifest.json
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="seafood-b${{ env.BUILD_NO }}"
          NOTES="iOS 16.4 未签名 IPA · 版本 ${{ env.VERSION }} · build ${{ env.BUILD_NO }} · TrollStore 安装"
          gh release create "$TAG" --title "海鲜台账 ${{ env.VERSION }} (b${{ env.BUILD_NO }})" --notes "$NOTES" \
            "${{ env.IPA }}" manifest.json >/dev/null
          # 滚动 tag 指最新，便于固定 URL
          gh release delete seafood-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create seafood-latest --title "最新构建" --notes "$NOTES" "${{ env.IPA }}" manifest.json >/dev/null

      - name: Upload build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build.log "build-log-b${{ env.BUILD_NO }}.log" 2>/dev/null || echo "no log" > "build-log-b${{ env.BUILD_NO }}.log"
          gh release create "log-b${{ env.BUILD_NO }}" --title "构建日志 b${{ env.BUILD_NO }}" --notes "失败构建日志" "build-log-b${{ env.BUILD_NO }}.log" || true
